name: Release

# Every push to main is a release, in three jobs:
#   1. prepare  - compute the next version from the PR label, in memory only
#                 (no git write yet, so there's nothing to undo if a later
#                 job fails).
#   2. publish  - build+push the images (per Task 2); the backend image gets
#                 the version baked in at build time via --build-arg, so it
#                 reports the right thing at runtime without git ever having
#                 to carry that version before the image is confirmed built.
#   3. release  - only runs if publish succeeded: bumps
#                 infrastructure/release.yaml (plus, cosmetically,
#                 backend/version.py and frontend/package.json), tags it,
#                 and publishes a GitHub Release with auto-generated notes.
# The loop guard is the "[skip ci]" marker in the release job's own commit
# message (GitHub Actions natively skips push-triggered runs for such a
# commit) rather than a paths-ignore list, since that commit touches more
# than one file and a path-based guard would need to be kept in sync with
# all of them. workflow_dispatch allows a manual re-run (e.g. to retry a
# release that failed for unrelated reasons).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.version.outputs.next }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The bump type comes from a label (release:major / release:minor /
      # release:patch) on the PR that was merged to produce this commit —
      # see README.md's "Releasing" section. No label -> patch, so a
      # forgotten label never blocks a release, it just defaults safely.
      - name: Determine version bump from PR label
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].labels[].name' 2>/dev/null || true)"
          if echo "$labels" | grep -qx "release:major"; then
            bump=major
          elif echo "$labels" | grep -qx "release:minor"; then
            bump=minor
          else
            bump=patch
          fi
          echo "Resolved bump: $bump (PR labels: $(echo "$labels" | tr '\n' ' '))"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        run: |
          current="$(grep -oE '^version: .*' infrastructure/release.yaml | awk '{print $2}')"
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ steps.bump.outputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and push images
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # GHCR image paths must be lowercase; the repo name isn't. The rolling
      # ":main" tag only moves on a real push to main — a manual
      # workflow_dispatch run still gets a real, pushed, SHA-tagged image,
      # just without repointing ":main" at a non-main run.
      - name: Compute image tags
        id: image
        run: |
          name="${REGISTRY}/${{ github.repository }}-${{ matrix.service }}"
          name="${name,,}"
          tags="$name:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="$(printf '%s\n%s' "$tags" "$name:main")"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Required for a reliable build+push: without a docker-container
      # builder, larger images (the frontend's node_modules-heavy build in
      # particular) can hit "ERROR: failed to build: unknown blob" on push.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          # Only the backend serves its version at runtime (/health, OpenAPI
          # docs) - frontend/package.json's "version" isn't read by the
          # running app, so there's nothing to bake in for that image.
          build-args: ${{ matrix.service == 'backend' && format('APP_VERSION={0}', needs.prepare.outputs.next_version) || '' }}

  release:
    name: Bump version and release
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update infrastructure/release.yaml
        run: |
          name_backend="${REGISTRY}/${{ github.repository }}-backend"
          name_frontend="${REGISTRY}/${{ github.repository }}-frontend"
          name_backend="${name_backend,,}"
          name_frontend="${name_frontend,,}"
          cat > infrastructure/release.yaml <<EOF
          version: ${{ needs.prepare.outputs.next_version }}

          images:
            backend: ${name_backend}:${{ github.sha }}
            frontend: ${name_frontend}:${{ github.sha }}
          EOF
        env:
          REGISTRY: ${{ env.REGISTRY }}

      # Cosmetic parity for anyone browsing the repo: the backend image
      # already has the correct version baked in from the build-arg above,
      # regardless of this step; frontend/package.json has no runtime
      # reader, so this is its only source of truth. Plain sed since each
      # file has exactly one "version" key to replace.
      - name: Bump application version files
        run: |
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"${{ needs.prepare.outputs.next_version }}\"/" backend/version.py
          sed -i "s/\"version\": \"[0-9.]*\"/\"version\": \"${{ needs.prepare.outputs.next_version }}\"/" frontend/package.json

      # "[skip ci]" in the message is the loop guard: GitHub Actions skips
      # push-triggered workflow runs for a commit whose message contains it,
      # regardless of which files it touches (see the `on:` block above).
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/release.yaml backend/version.py frontend/package.json
          git commit -m "chore(release): v${{ needs.prepare.outputs.next_version }} [skip ci]"
          git tag "v${{ needs.prepare.outputs.next_version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ needs.prepare.outputs.next_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.prepare.outputs.next_version }}" \
            --title "v${{ needs.prepare.outputs.next_version }}" \
            --generate-notes
