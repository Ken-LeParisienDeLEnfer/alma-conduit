name: CI - Backend

# Also triggered by docker-compose.yml/Makefile: the backend's build context
# and its `make lint-backend`/`test-backend` targets are defined there, not
# just under backend/.
on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-backend.yml"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    # Mirrors the README's `docker run -p 5433:5432 ...` test database: same
    # image, same credentials, same host-side port, so backend/.env.test
    # works here completely unmodified.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit_test
          POSTGRES_PASSWORD: conduit_test
          POSTGRES_DB: conduit_test
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U conduit_test -d conduit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen --group dev

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

  docker-build:
    name: Docker build (sanity check, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build-backend
