name: CI - Frontend

# Also triggered by docker-compose.yml/Makefile: the frontend's build context
# and its `make lint-frontend`/`test-frontend` targets are defined there, not
# just under frontend/.
on:
  pull_request:
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - "Makefile"
      - ".github/workflows/ci-frontend.yml"

jobs:
  lint:
    name: Lint (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: eslint
        working-directory: frontend
        run: npm run lint

      - name: prettier --check
        working-directory: frontend
        run: npm run format:check

  test:
    name: Test (jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watchAll=false

  docker-build:
    name: Docker build (sanity check, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build-frontend
