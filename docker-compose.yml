# Standard local development Docker environment for Conduit.

services:
  db:
    image: postgres:16-alpine
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file: ./backend/.env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  backend-venv:
